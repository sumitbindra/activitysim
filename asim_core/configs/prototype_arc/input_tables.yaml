# ARC example: input columns beyond asim_core's standard tables.
# Column names are as the models see them, after settings.yaml's renames.
# Several columns are PUMS variables, where -9 means "not applicable".

tables:
  households:
    columns:
      num_workers: {type: int64, unit: persons, description: Workers in the household., min: 0}
      hincp: {type: int64, unit: dollars per year, description: "Household income (can be negative, as in PUMS)."}
      hht: {type: int64, description: PUMS household type (1 to 7)., values: [1, 2, 3, 4, 5, 6, 7]}

  persons:
    columns:
      home_zone_id: {type: int64, description: Zone the person lives in., references: land_use.zone_id}
      PNUM: {type: int64, description: Person number within the household., min: 1}
      agep: {type: int64, unit: years, description: Age., min: 0, max: 120, warn_above: 100}
      pecasOcc:
        type: int64
        description: "Occupation: 0 none, 1 white collar, 2 services, 3 health, 4 retail and food, 5 blue collar."
        values: [0, 1, 2, 3, 4, 5]
      sex: {type: int64, description: "1 male, 2 female.", values: [1, 2]}
      esr: {type: int64, description: PUMS employment status (codes 1 to 6; -9 not applicable)., values: [-9, 1, 2, 3, 4, 5, 6]}
      wkw: {type: int64, description: PUMS weeks worked last year (codes 1 to 6; -9 not applicable)., values: [-9, 1, 2, 3, 4, 5, 6]}
      wkhp: {type: int64, unit: hours per week, description: Usual hours worked (-9 not applicable)., min: -9, max: 99}
      schg:
        type: int64
        description: >-
          PUMS grade attending, in the 1 to 7 coding the models expect
          (6 and 7 are college; -9 not attending).
        values: [-9, 1, 2, 3, 4, 5, 6, 7]

  land_use:
    columns:
      retail: {type: int64, unit: jobs, description: Retail employment., min: 0}
      service: {type: int64, unit: jobs, description: Service employment., min: 0}
      emp:
        type: int64
        unit: jobs
        description: Total employment.
        min: 0
        sum_of: [N11, N21, N22, N23, N313233, N42, N4445, N4849, N51, N52, N53, N54, N55, N56, N61, N62, N71, N72, N81, N92]
      pop: {type: int64, unit: persons, description: Population., min: 0}
      hshld: {type: int64, unit: households, description: Households., min: 0}
      univ: {type: int64, unit: students, description: University enrollment., min: 0}
      acres: {type: int64, unit: acres, description: Area., min: 0}
      PARKTOT: {type: int64, unit: spaces, description: Parking spaces., min: 0}
      PARKLNG: {type: int64, unit: spaces, description: Long-term parking spaces., min: 0}
      PROPFREE: {type: float64, description: Share of parking that is free., min: 0, max: 1}
      PARKRATE: {type: float64, description: Parking rate., min: 0}
      areatype: {type: int64, description: Area type (lower is more urban)., min: 1}
      county: {type: int64, description: County., min: 1}
      CBDFlag: {type: int64, description: "1 in the central business district, 0 not.", values: [0, 1]}
      N11: {type: int64, unit: jobs, description: "Employment, NAICS 11 (agriculture).", min: 0}
      N21: {type: int64, unit: jobs, description: "Employment, NAICS 21 (mining).", min: 0}
      N22: {type: int64, unit: jobs, description: "Employment, NAICS 22 (utilities).", min: 0}
      N23: {type: int64, unit: jobs, description: "Employment, NAICS 23 (construction).", min: 0}
      N313233: {type: int64, unit: jobs, description: "Employment, NAICS 31-33 (manufacturing).", min: 0}
      N42: {type: int64, unit: jobs, description: "Employment, NAICS 42 (wholesale).", min: 0}
      N4445: {type: int64, unit: jobs, description: "Employment, NAICS 44-45 (retail).", min: 0}
      N4849: {type: int64, unit: jobs, description: "Employment, NAICS 48-49 (transportation).", min: 0}
      N51: {type: int64, unit: jobs, description: "Employment, NAICS 51 (information).", min: 0}
      N52: {type: int64, unit: jobs, description: "Employment, NAICS 52 (finance).", min: 0}
      N53: {type: int64, unit: jobs, description: "Employment, NAICS 53 (real estate).", min: 0}
      N54: {type: int64, unit: jobs, description: "Employment, NAICS 54 (professional services).", min: 0}
      N55: {type: int64, unit: jobs, description: "Employment, NAICS 55 (management).", min: 0}
      N56: {type: int64, unit: jobs, description: "Employment, NAICS 56 (administrative support).", min: 0}
      N61: {type: int64, unit: jobs, description: "Employment, NAICS 61 (education).", min: 0}
      N62: {type: int64, unit: jobs, description: "Employment, NAICS 62 (health care).", min: 0}
      N71: {type: int64, unit: jobs, description: "Employment, NAICS 71 (arts and recreation).", min: 0}
      N72: {type: int64, unit: jobs, description: "Employment, NAICS 72 (accommodation and food).", min: 0}
      N81: {type: int64, unit: jobs, description: "Employment, NAICS 81 (other services).", min: 0}
      N92: {type: int64, unit: jobs, description: "Employment, NAICS 92 (public administration).", min: 0}
      EnrollDS: {type: int64, unit: students, description: School enrollment (public school districts)., min: 0}
      EnrollPD: {type: int64, unit: students, description: School enrollment (private)., min: 0}
      I_PCTLT10K: {type: float64, unit: percent, description: Households with income under $10k., min: 0, max: 100}
      I_PCT10TO20: {type: float64, unit: percent, description: Households with income $10k to $20k., min: 0, max: 100}
      I_PCT20TO40: {type: float64, unit: percent, description: Households with income $20k to $40k., min: 0, max: 100}
      I_PCTGT40: {type: float64, unit: percent, description: Households with income over $40k., min: 0, max: 100}
      RetailEmp30: {type: float64, unit: jobs, min: 0}
      PARKING_ZONE: {type: int64, min: 0}
