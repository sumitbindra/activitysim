# asim_core model file (formulas in asim_core's language; see docs/model_files.md)
# values: one row per origin-destination pair; dest_zone is the destination's land use

kind: accessibility
description: For every zone, how many jobs can be reached, by mode and time of day (converted from accessibility.yaml
  and accessibility.csv).
values: accessibility_values.csv
total: log1p_of_sum
constants:
  dispersion_parameter_automobile: -0.05
  dispersion_parameter_transit: -0.05
  dispersion_parameter_walk: -1.0
  maximum_walk_distance: 3.0
  out_of_vehicle_time_weight: 2.0
options:
  origins_per_batch: null
