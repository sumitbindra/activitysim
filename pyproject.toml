[project]
name = "asim-harness"
version = "0.1.0"
description = "Reproducible, agent-operable harness for running ActivitySim's prototype_mtc example"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # ActivitySim and the pins the prototype_mtc example environment needs
    "activitysim==1.4",
    "multimethod<2.0",
    "numba>=0.57",
    "numpy>=1.16.1,<1.26",
    "openmatrix>=0.3.5.0",
    "pandas>=2.1.0,<3",
    "pandera>=0.15,<0.18.1",
    "psutil>=4.1",
    "pydantic>=2.6",
    "setuptools>=80.9.0,<81",
    "sharrow>=2.14.0",
    "tables>=3.9",
    # harness
    "click>=8.1",
    "pyyaml>=6.0",
    "mcp>=1.2",
]

[project.scripts]
asim = "asim_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asim_harness"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "zstandard>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that run the example model (deselect with '-m \"not slow\"')",
]
