[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "activitysim-kernel"
description = "Optional Rust kernel for ActivitySim destination/location choice"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# Build the abi3 extension module `activitysim_kernel`.
features = ["python"]
module-name = "activitysim_kernel"
